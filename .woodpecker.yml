steps:
  verify:
    image: node:22-bookworm
    commands:
      - git clone --depth 1 https://github.com/baditaflorin/mesh-common.git ../mesh-common
      - npm ci --prefix ../mesh-common
      - npm ci
      - npx playwright install --with-deps chromium
      - npm run fmt:check
      - npm run typecheck
      - npm run test
      - npm run smoke
      - MESH_RUN_LEAK_TEST=1 MESH_LEAK_DURATION_MS=5000 MESH_LEAK_NOISE_OPS=20 npm run test:leak
      - npm audit --audit-level=low
      - npm run audit:security
      - node ../mesh-common/scripts/generate-privacy-section.mjs --check

when:
  event:
    - push
    - pull_request
